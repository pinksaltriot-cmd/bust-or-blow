<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bust or Blow</title>
<style>
  :root{
    --bg:#061625; --panel:#0d1b2a; --panel2:#12293f; --edge:#1b3a5b;
    --ink:#cbd5e1; --ink2:#94a3b8; --accent:#4f9cf9; --accentwarm:#f97316;
    --head:#7fb3cc;
    --bust:#f87171; --blow:#38bdf8; --bull:#4ade80;
    --snow:#93c5fd; --rain:#6ee7b7; --ice:#c084fc; --severe:#fbbf24; --wind:#a5b4fc; --cold:#7dd3fc;
  }
  *{box-sizing:border-box}
  body{margin:0;font:14px/1.45 system-ui,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink)}
  header{padding:12px 18px;border-bottom:1px solid var(--edge);display:flex;align-items:center;gap:10px}
  header h1{font-size:16px;margin:0;font-weight:700;color:#e2e8f0}
  header .sub{color:var(--ink2);font-size:12px}
  .app{display:flex;align-items:stretch;min-height:calc(100vh - 49px)}
  aside{flex:0 0 340px;border-right:1px solid var(--edge);padding:14px;overflow:auto}
  main{flex:1;padding:14px;overflow:auto}
  @media (max-width:860px){ .app{flex-direction:column} aside{flex:none;border-right:none;border-bottom:1px solid var(--edge)} }
  h2.sec{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--head);margin:16px 0 8px}
  button{font:inherit;background:var(--panel2);color:var(--ink);border:1px solid var(--edge);border-radius:6px;padding:7px 12px;cursor:pointer}
  button:hover{border-color:var(--accent)}
  .selftest{max-width:760px;margin:0 auto;padding:20px;font-family:ui-monospace,Menlo,monospace}
  .selftest .pass{color:#4ade80}.selftest .fail{color:#f87171}
  .selftest .sum{font-size:18px;font-weight:700;margin-bottom:12px}
</style>
</head>
<body>
<header>
  <span style="font-size:20px">🎯</span>
  <h1>Bust or Blow</h1>
  <span class="sub">engineer a column · issue a forecast · dial the outcome</span>
</header>

<div class="app" id="app">
  <aside id="inputs"><!-- Task 12 --></aside>
  <main id="results"><!-- Tasks 11 + 12 --></main>
</div>

<div class="selftest" id="selftest" style="display:none"></div>

<script>
"use strict";
const BOB = {};
window.__bobTests = window.__bobTests || [];

/* ================= CONSTANTS (Task 1) ================= */
window.__bobTests.push((t) => {
  t('harness alive', 1 + 1 === 2);
  t('6 levels in order', BOB.LEVELS.length===6 &&
     BOB.LEVELS.map(l=>l.ftAlt).join(',')==='0,5000,10000,18000,30000,40000');
  t('5 soil depths', BOB.SOIL.length===5 &&
     BOB.SOIL.map(s=>s.inches).join(',')==='0,2,4,8,20');
  t('14 regions with clim', BOB.REGIONS.length===14 &&
     BOB.REGIONS.every(r=>r.key && r.name && r.clim &&
       typeof r.clim.snow==='number' && typeof r.clim.severe==='number'));
  t('7 slider stops, monotonic pct', (function(){
     const s=BOB.SLIDER_STOPS; if(s.length!==7) return false;
     for(let i=1;i<s.length;i++) if(s[i].pct<=s[i-1].pct) return false;
     return s[0].pos===-3 && s[3].pos===0 && s[3].pct===0.5 && s[6].pos===3;
  })());
  t('default column valid', (function(){
     const c=BOB.DEFAULT_COLUMN;
     return c && c.levels && c.levels.eye && typeof c.levels.eye.t==='number' &&
       c.soil && typeof c.soil.skin==='number' &&
       typeof c.moisture==='number' && typeof c.region==='string' &&
       BOB.REGIONS.some(r=>r.key===c.region);
  })());
});

BOB.LEVELS = [
  {key:'eye', label:'Eye level', ftAlt:0},
  {key:'l5',  label:'5,000 ft',  ftAlt:5000},
  {key:'l10', label:'10,000 ft', ftAlt:10000},
  {key:'l18', label:'18,000 ft', ftAlt:18000},
  {key:'l30', label:'30,000 ft', ftAlt:30000},
  {key:'l40', label:'40,000 ft', ftAlt:40000},
];
BOB.SOIL = [
  {key:'skin', label:'Surface', inches:0},
  {key:'d2',   label:'2 in',    inches:2},
  {key:'d4',   label:'4 in',    inches:4},
  {key:'d8',   label:'8 in',    inches:8},
  {key:'d20',  label:'20 in',   inches:20},
];
// clim: per-event-type propensity multipliers (1 = neutral). cx,cy = SVG map coords (0-1000 x, 0-620 y).
BOB.REGIONS = [
  {key:'pnw',    name:'Pacific Northwest',   cx:120, cy:110, clim:{snow:1.0, ice:0.7, rain:1.6, severe:0.5, wind:1.3, cold:0.9}},
  {key:'cawest', name:'California / West Coast', cx:95, cy:300, clim:{snow:0.6, ice:0.4, rain:1.4, severe:0.5, wind:1.1, cold:0.6}},
  {key:'swdes',  name:'Desert Southwest',    cx:250, cy:360, clim:{snow:0.5, ice:0.4, rain:0.7, severe:1.0, wind:1.1, cold:0.7}},
  {key:'nrock',  name:'Northern Rockies',    cx:330, cy:150, clim:{snow:1.4, ice:0.7, rain:0.7, severe:0.7, wind:1.2, cold:1.4}},
  {key:'srock',  name:'Southern Rockies',    cx:360, cy:300, clim:{snow:1.2, ice:0.7, rain:0.7, severe:0.9, wind:1.2, cold:1.1}},
  {key:'nplains',name:'Northern Plains',     cx:500, cy:150, clim:{snow:1.3, ice:1.0, rain:0.9, severe:1.2, wind:1.4, cold:1.5}},
  {key:'splains',name:'Southern Plains',     cx:520, cy:360, clim:{snow:0.8, ice:1.2, rain:1.0, severe:1.6, wind:1.3, cold:0.9}},
  {key:'umidw',  name:'Upper Midwest',       cx:600, cy:150, clim:{snow:1.4, ice:1.1, rain:1.0, severe:1.1, wind:1.2, cold:1.5}},
  {key:'glakes', name:'Great Lakes',         cx:670, cy:180, clim:{snow:1.5, ice:1.1, rain:1.0, severe:1.0, wind:1.1, cold:1.3}},
  {key:'ohval',  name:'Ohio Valley',         cx:680, cy:290, clim:{snow:1.0, ice:1.2, rain:1.2, severe:1.2, wind:1.0, cold:1.0}},
  {key:'matl',   name:'Mid-Atlantic',        cx:790, cy:300, clim:{snow:1.0, ice:1.1, rain:1.2, severe:1.0, wind:1.0, cold:0.9}},
  {key:'ne',     name:'Northeast / New England', cx:850, cy:190, clim:{snow:1.4, ice:1.1, rain:1.1, severe:0.8, wind:1.2, cold:1.2}},
  {key:'se',     name:'Southeast',           cx:760, cy:400, clim:{snow:0.5, ice:0.9, rain:1.3, severe:1.3, wind:1.1, cold:0.7}},
  {key:'gulf',   name:'Gulf Coast',          cx:640, cy:470, clim:{snow:0.3, ice:0.6, rain:1.5, severe:1.4, wind:1.3, cold:0.6}},
];
BOB.SLIDER_STOPS = [
  {pos:-3, key:'bigbust', label:'Big Bust',      pct:0.05},
  {pos:-2, key:'bust',    label:'Bust',          pct:0.15},
  {pos:-1, key:'modbust', label:'Moderate Bust', pct:0.30},
  {pos: 0, key:'bull',    label:'Bullseye',      pct:0.50},
  {pos: 1, key:'modblow', label:'Moderate Blow', pct:0.70},
  {pos: 2, key:'blow',    label:'Blow',          pct:0.85},
  {pos: 3, key:'bigblow', label:'Big Blow',      pct:0.95},
];
BOB.RANGES = {
  t:{min:-60, max:120, step:1},        // °F
  p:{min:100, max:1050, step:1},       // mb (upper levels naturally low)
  ws:{min:0, max:200, step:1},         // kt
  wd:{min:0, max:360, step:5},         // deg
  soil:{min:-20, max:110, step:1},     // °F
  moisture:{min:0, max:100, step:1},
};
BOB.DEFAULT_COLUMN = {
  levels:{
    eye:{t:30, p:1008, ws:15, wd:180},
    l5: {t:22, p:845,  ws:25, wd:200},
    l10:{t:10, p:700,  ws:40, wd:220},
    l18:{t:-8, p:500,  ws:60, wd:250},
    l30:{t:-32,p:300,  ws:85, wd:270},
    l40:{t:-52,p:200,  ws:100,wd:275},
  },
  soil:{skin:31, d2:33, d4:35, d8:38, d20:42},
  moisture:65,
  region:'splains',
};

/* ================= ENGINE (Tasks 2-10) ================= */
window.__bobTests.push((t, approx) => {
  const D = BOB.diagnose;
  // deep-cold column -> snow, freezing level at/near surface
  const cold = JSON.parse(JSON.stringify(BOB.DEFAULT_COLUMN));
  cold.levels.eye.t = 20; cold.soil.skin = 25;
  let d = D(cold);
  t('cold column -> snow', d.precipType==='snow');
  t('cold freezing level low', d.freezingLevelFt <= 1000);
  // warm surface, warm all the way -> rain, no cold layer
  const warm = JSON.parse(JSON.stringify(BOB.DEFAULT_COLUMN));
  warm.levels.eye.t=55; warm.levels.l5.t=45; warm.levels.l10.t=32; warm.soil.skin=60;
  d = D(warm);
  t('warm column -> rain', d.precipType==='rain');
  t('warm freezing level aloft', d.freezingLevelFt >= 6000);
  // warm nose: cold sfc, warm layer at l5, cold above -> sleet or zr (not plain snow/rain)
  const nose = JSON.parse(JSON.stringify(BOB.DEFAULT_COLUMN));
  nose.levels.eye.t=26; nose.levels.l5.t=37; nose.levels.l10.t=20; nose.soil.skin=27;
  d = D(nose);
  t('warm nose detected', d.warmNose===true);
  t('warm nose -> ice family', d.precipType==='sleet' || d.precipType==='zr');
});

// Return array of {ft, t} sampled at the 6 levels, surface first.
BOB._profile = function(col){
  return BOB.LEVELS.map(l => ({ ft:l.ftAlt, t: col.levels[l.key].t }));
};
// Lowest altitude (ft) where temperature crosses 32°F going up. If surface already >32,
// interpolate to where it drops to 32; if never above 32, returns 0.
BOB._freezingLevelFt = function(prof){
  if (prof[0].t <= 32) {
    // find first segment rising through 32 (warm nose base); else surface is freezing
    for (let i=0;i<prof.length-1;i++){
      const a=prof[i], b=prof[i+1];
      if (a.t<=32 && b.t>32) return a.ft + (b.ft-a.ft)*((32-a.t)/(b.t-a.t));
    }
    return 0;
  }
  // surface above freezing: find where it first drops to 32 going up
  for (let i=0;i<prof.length-1;i++){
    const a=prof[i], b=prof[i+1];
    if (a.t>32 && b.t<=32) return a.ft + (b.ft-a.ft)*((a.t-32)/(a.t-b.t));
  }
  return prof[prof.length-1].ft; // whole column above freezing
};
// Warm nose = a subfreezing surface with an above-freezing layer aloft below ~12k ft.
BOB._warmNose = function(prof){
  if (prof[0].t > 32) return false;
  for (const p of prof){ if (p.ft>0 && p.ft<=12000 && p.t>32) return true; }
  return false;
};
// pw (precipitable-water proxy, in) gates whether there is anything to fall at all:
// a moisture-starved column produces 'none', not a 0.0-in snowstorm.
BOB.PW_PRECIP_MIN = 0.10;
BOB._precipType = function(prof, soilSkin, pw){
  if (pw != null && pw < BOB.PW_PRECIP_MIN) return 'none';
  const sfc = prof[0].t;
  const warmNose = BOB._warmNose(prof);
  if (warmNose){
    // deep cold surface layer freezes drops on contact -> freezing rain; shallow -> sleet
    return (sfc <= 28 && soilSkin <= 30) ? 'zr' : 'sleet';
  }
  if (sfc >= 36) return 'rain';
  if (sfc <= 30) return 'snow';
  return 'mix'; // 30 < sfc < 36, no warm nose
};

BOB._clamp01 = x => Math.max(0, Math.min(1, x));
// mean lapse rate eye->18k in °F per 1000 ft (positive = cooling with height)
BOB._lapseRate = function(col){
  const dT = col.levels.eye.t - col.levels.l18.t;
  return dT / (18000/1000);
};
// bulk shear = magnitude of vector wind difference eye -> l30 (kt)
BOB._bulkShear = function(col){
  const toUV = (ws,wd)=>{ const r=wd*Math.PI/180; return [-ws*Math.sin(r), -ws*Math.cos(r)]; };
  const [u0,v0]=toUV(col.levels.eye.ws, col.levels.eye.wd);
  const [u1,v1]=toUV(col.levels.l30.ws, col.levels.l30.wd);
  return Math.hypot(u1-u0, v1-v0);
};
BOB._dirShear = function(col){
  let d = Math.abs(col.levels.l30.wd - col.levels.eye.wd) % 360;
  return d>180 ? 360-d : d;
};
// precipitable-water proxy (inches): moisture dial modulated by boundary-layer warmth
BOB._pw = function(col){
  const warmth = BOB._clamp01((col.levels.eye.t + 10)/90); // colder air holds less
  return (col.moisture/100) * (0.3 + 2.2*warmth);
};
// Surface-low strength proxy. The raw 1013-p deficit is unbounded over the input range
// (p can be set to 100 mb), so it saturates: linear to 40 mb of deficit — the range real
// extratropical lows live in, and where the tuning below is calibrated — then
// exponentially approaching a 75 mb ceiling. The shear contribution saturates too.
BOB.WIND_DEFICIT_LINEAR = 40;   // mb of deficit treated 1:1
BOB.WIND_DEFICIT_EXTRA  = 35;   // additional mb available asymptotically
BOB.WIND_SHEAR_CAP      = 120;  // kt of bulk shear beyond which no extra credit
BOB._windPot = function(col){
  const deficit = Math.max(0, 1013 - col.levels.eye.p);
  const L = BOB.WIND_DEFICIT_LINEAR, E = BOB.WIND_DEFICIT_EXTRA;
  const sat = deficit <= L ? deficit : L + E*(1 - Math.exp(-(deficit-L)/E));
  return sat + 0.15*Math.min(BOB._bulkShear(col), BOB.WIND_SHEAR_CAP);
};
BOB._soilFreeze = function(col){
  const vals = BOB.SOIL.map(s=>col.soil[s.key]);
  const frac = vals.filter(v=>v<=32).length / vals.length;
  return frac;
};
BOB._groundWarmth = function(col){
  const mean = BOB.SOIL.reduce((a,s)=>a+col.soil[s.key],0)/BOB.SOIL.length;
  return BOB._clamp01((mean-20)/60);
};
BOB._instability = function(col){
  const lapse = BOB._lapseRate(col);
  const lapseN = BOB._clamp01((lapse-3)/6);   // 3 stable -> 9 very steep
  const pwN = BOB._clamp01(BOB._pw(col)/2.0);
  const warmN = BOB._clamp01((col.levels.eye.t-40)/50);
  return BOB._clamp01(0.5*lapseN + 0.3*pwN + 0.2*warmN);
};
// marginality drives envelope width: peaks when the setup is on a knife's edge.
BOB._marginality = function(col, precipType){
  const sfc = col.levels.eye.t;
  const thermMarg = 1 - BOB._clamp01(Math.abs(sfc-32)/12); // near 32°F = marginal
  const inst = BOB._instability(col);
  const instMarg = 1 - Math.abs(inst-0.5)*2;               // mid instability = uncertain
  const mixMarg = (precipType==='mix'||precipType==='sleet'||precipType==='zr') ? 0.3 : 0;
  return BOB._clamp01(0.45*thermMarg + 0.35*instMarg + mixMarg);
};
// The atmosphere's ceiling on deep convection: shear organizes a storm but cannot create
// one. Continuous in both instability and moisture, so a loaded column is unaffected (1)
// while a dry or stable column is scaled toward 0 — no updraft, no outbreak.
BOB.CONV_INST_FULL = 0.30;  // instability at which the gate opens fully
BOB.CONV_PW_FULL   = 0.80;  // pw (in) at which the gate opens fully
BOB._convectiveGate = function(diag){
  return BOB._clamp01(diag.instability/BOB.CONV_INST_FULL)
       * BOB._clamp01(diag.pw/BOB.CONV_PW_FULL);
};

BOB.diagnose = function(col){
  const prof = BOB._profile(col);
  const freezingLevelFt = BOB._freezingLevelFt(prof);
  const warmNose = BOB._warmNose(prof);
  const precipType = BOB._precipType(prof, col.soil.skin, BOB._pw(col));
  const lapseRate = BOB._lapseRate(col);
  const bulkShearKt = BOB._bulkShear(col);
  const dirShearDeg = BOB._dirShear(col);
  const pw = BOB._pw(col);
  const windPot = BOB._windPot(col);
  const soilFreeze = BOB._soilFreeze(col);
  const groundWarmth = BOB._groundWarmth(col);
  const instability = BOB._instability(col);
  const marginality = BOB._marginality(col, precipType);
  return { prof, freezingLevelFt, warmNose, precipType, lapseRate, bulkShearKt,
           dirShearDeg, pw, windPot, soilFreeze, groundWarmth, instability, marginality };
};

window.__bobTests.push((t, approx) => {
  const D = BOB.diagnose;
  const c = JSON.parse(JSON.stringify(BOB.DEFAULT_COLUMN));
  // steep lapse: big drop eye->l18
  c.levels.eye.t=75; c.levels.l18.t=-15; c.moisture=90;
  let d = D(c);
  t('lapse computed °F/kft', d.lapseRate > 3 && d.lapseRate < 12);
  t('instability in 0..1', d.instability>=0 && d.instability<=1);
  t('high instability when steep+moist', d.instability > 0.6);
  // bulk shear from eye vs l30 wind vectors
  const s = JSON.parse(JSON.stringify(BOB.DEFAULT_COLUMN));
  s.levels.eye.ws=10; s.levels.eye.wd=180; s.levels.l30.ws=90; s.levels.l30.wd=270;
  d = D(s);
  t('bulk shear positive', d.bulkShearKt > 40);
  t('pw scales with moisture', D(Object.assign({},c,{moisture:0})).pw <
                               D(Object.assign({},c,{moisture:100})).pw);
  // low surface pressure -> higher wind potential proxy
  const lo = JSON.parse(JSON.stringify(BOB.DEFAULT_COLUMN)); lo.levels.eye.p=968;
  const hi = JSON.parse(JSON.stringify(BOB.DEFAULT_COLUMN)); hi.levels.eye.p=1024;
  t('lower surface pressure -> more windPot', D(lo).windPot > D(hi).windPot);
  // soil: all frozen -> soilFreeze high
  const fz = JSON.parse(JSON.stringify(BOB.DEFAULT_COLUMN));
  fz.soil={skin:20,d2:22,d4:24,d8:26,d20:28};
  t('soilFreeze high when frozen', D(fz).soilFreeze > 0.7);
  t('marginality in 0..1', d.marginality>=0 && d.marginality<=1);
});

window.__bobTests.push((t) => {
  const clone = ()=>JSON.parse(JSON.stringify(BOB.DEFAULT_COLUMN));
  // classic snowstorm: cold, moist, plains
  let c=clone(); c.levels.eye.t=24; c.soil.skin=26; c.moisture=80; c.region='umidw';
  let cls=BOB.classify(BOB.diagnose(c), c.region);
  t('cold moist -> snowstorm/blizzard', cls.dominant==='snowstorm'||cls.dominant==='blizzard');
  // add strong low-level wind -> blizzard
  c.levels.eye.ws=45; c.levels.eye.p=975;
  cls=BOB.classify(BOB.diagnose(c), c.region);
  t('cold+wind -> blizzard', cls.dominant==='blizzard');
  // hot, steep, sheared, southern plains -> severe
  let s=clone(); s.levels.eye.t=82; s.levels.l18.t=-20; s.moisture=90;
  s.levels.eye.ws=15; s.levels.l30.ws=95; s.levels.l30.wd=270; s.region='splains';
  cls=BOB.classify(BOB.diagnose(s), s.region);
  t('hot sheared -> severe', cls.dominant==='severe');
  // warm nose over cold surface -> icestorm
  let i=clone(); i.levels.eye.t=27; i.levels.l5.t=38; i.levels.l10.t=22; i.soil.skin=26; i.moisture=70;
  cls=BOB.classify(BOB.diagnose(i), i.region);
  t('warm nose -> icestorm', cls.dominant==='icestorm');
  // very cold, dry, no precip -> coldoutbreak
  let co=clone(); co.levels.eye.t=-15; co.moisture=5; co.soil.skin=5;
  cls=BOB.classify(BOB.diagnose(co), co.region);
  t('very cold dry -> coldoutbreak', cls.dominant==='coldoutbreak');
  t('scores object present', cls.scores && typeof cls.scores.snowstorm==='number');
});

window.__bobTests.push((t) => {
  const clone=()=>JSON.parse(JSON.stringify(BOB.DEFAULT_COLUMN));
  const F=(c)=>{const d=BOB.diagnose(c);return BOB.forecast(c,d,BOB.classify(d,c.region));};
  let c=clone(); c.levels.eye.t=22; c.soil.skin=25; c.moisture=85; c.region='umidw';
  let fc=F(c);
  t('snow forecast has inches unit', fc.type==='snowstorm'||fc.type==='blizzard');
  t('snow value positive', fc.unit==='in' && fc.value>0);
  t('more moisture -> more snow', (function(){
     const a=clone(); a.levels.eye.t=22; a.soil.skin=25; a.moisture=30; a.region='umidw';
     const b=clone(); b.levels.eye.t=22; b.soil.skin=25; b.moisture=95; b.region='umidw';
     return F(b).value > F(a).value;
  })());
  let s=clone(); s.levels.eye.t=82; s.levels.l18.t=-20; s.moisture=90;
  s.levels.eye.ws=15; s.levels.l30.ws=95; s.levels.l30.wd=270; s.region='splains';
  t('severe forecast 0..5 scale', (function(){const f=F(s);return f.type==='severe'&&f.unit==='EF'&&f.value>=0&&f.value<=5;})());
  let co=clone(); co.levels.eye.t=-15; co.moisture=5; co.soil.skin=5;
  t('coldoutbreak value is a temperature', (function(){const f=F(co);return f.type==='coldoutbreak'&&f.unit==='°F'&&f.value<20;})());
});

window.__bobTests.push((t, approx) => {
  const fc = {type:'snowstorm', unit:'in', value:10, label:'Snowfall'};
  const marg = BOB.envelope(fc, {marginality:0.9, precipType:'snow'});
  const tight = BOB.envelope(fc, {marginality:0.05, precipType:'snow'});
  t('bullseye equals forecast', approx(marg.at(0.5), 10, 1e-6));
  t('envelope monotonic', marg.at(0.05)<marg.at(0.5) && marg.at(0.5)<marg.at(0.95));
  t('marginal wider than robust', (marg.at(0.95)-marg.at(0.05)) > (tight.at(0.95)-tight.at(0.05)));
  t('lo never below zero for amounts', marg.at(0.05) >= 0);
  // resolve across all 7 stops is monotonic non-decreasing
  const diag={marginality:0.6, precipType:'snow'};
  const vals = [-3,-2,-1,0,1,2,3].map(p=>BOB.resolve(fc,diag,p).actual);
  let mono=true; for(let i=1;i<vals.length;i++) if(vals[i]<vals[i-1]) mono=false;
  t('7-stop resolve monotonic', mono);

BOB.EVENT_TYPES = ['snowstorm','blizzard','icestorm','rainflood','severe','highwind','coldoutbreak'];
BOB.classify = function(diag, regionKey){
  const region = BOB.REGIONS.find(r=>r.key===regionKey) || {clim:{snow:1,ice:1,rain:1,severe:1,wind:1,cold:1}};
  const cl = region.clim;
  const cold = BOB._clamp01((32 - diag.prof[0].t)/40);      // how far below freezing
  const veryCold = BOB._clamp01((10 - diag.prof[0].t)/40);
  const snowy = (diag.precipType==='snow') ? 1 : (diag.precipType==='mix'?0.4:0);
  const lowWind = BOB._clamp01((diag.windPot-20)/60);
  const convGate = BOB._convectiveGate(diag);
  const shearN = BOB._clamp01(diag.bulkShearKt/70);
  const dirN = BOB._clamp01(diag.dirShearDeg/90);   // veering with height favors rotation
  const s = {};
  s.snowstorm  = cl.snow  * (0.55*snowy + 0.6*BOB._clamp01(diag.pw/1.5) + 0.35*cold);
  s.blizzard   = cl.snow  * cl.wind * (snowy>0?1:0) * (0.6*BOB._clamp01(diag.pw/1.2) + 0.8*lowWind + 0.4*cold);
  s.icestorm   = cl.ice   * (diag.warmNose?1:0) * (0.8 + 0.5*BOB._clamp01(diag.pw/1.2));
  s.rainflood  = cl.rain  * ((diag.precipType==='rain'||diag.precipType==='zr')?1:0.2) * (0.9*BOB._clamp01(diag.pw/2.0));
  // gated: shear and directional shear only count once there is instability and moisture
  s.severe     = cl.severe* convGate * (0.55*diag.instability + 0.40*shearN + 0.20*dirN
                                        + 0.25*BOB._clamp01(diag.pw/1.8));
  s.highwind   = cl.wind  * (0.9*lowWind + 0.3*shearN);
  s.coldoutbreak = cl.cold* (0.9*veryCold + 0.4*(1-BOB._clamp01(diag.pw/1.0)));
  // pick dominant, then secondary
  const ordered = Object.keys(s).sort((a,b)=>s[b]-s[a]);
  return { dominant: ordered[0], secondary: (s[ordered[1]]>0.35*s[ordered[0]] ? ordered[1] : null), scores:s };
};

// Single rounding rule per (event type, unit), shared by forecast() and resolve() so the
// report card never reads "8.0 in → 11.07 in". Ice accretion is the one quantity that
// genuinely needs hundredths; everything else in inches is reported in tenths.
BOB._roundFor = function(type, unit, v){
  if (unit === 'kt') return Math.round(v);
  if (type === 'icestorm') return +v.toFixed(2);
  return +v.toFixed(1);   // in, °F, EF
};
BOB.forecast = function(col, diag, cls){
  const type = cls.dominant;
  const pw = diag.pw;
  switch(type){
    case 'snowstorm':
    case 'blizzard': {
      // snow ratio grows as it gets colder (dendritic), soil that's frozen keeps it
      const ratio = 8 + 6*BOB._clamp01((32-col.levels.eye.t)/30);      // 8:1 .. 14:1
      const surfKeep = 0.5 + 0.5*BOB._clamp01((34-col.soil.skin)/14);  // warm skin melts
      const keep = surfKeep * (1 - 0.3*diag.groundWarmth);             // warm deep soil melts from below
      const val = pw * ratio * keep;
      return { type, unit:'in', value:BOB._roundFor(type,'in',val), label:'Snowfall' };
    }
    case 'icestorm': {
      const val = pw * 0.35 * (col.soil.skin<=30?1:0.6);
      return { type, unit:'in', value:BOB._roundFor(type,'in',val), label:'Ice accretion' };
    }
    case 'rainflood': {
      const val = pw * 1.6;
      return { type, unit:'in', value:BOB._roundFor(type,'in',val), label:'Rainfall' };
    }
    case 'severe': {
      // same atmospheric ceiling as the classifier: no instability + moisture, no tornado
      const val = 5 * BOB._convectiveGate(diag)
                * BOB._clamp01(0.5*diag.instability
                             + 0.3*BOB._clamp01(diag.bulkShearKt/70)
                             + 0.2*BOB._clamp01(diag.dirShearDeg/90));
      return { type, unit:'EF', value:BOB._roundFor(type,'EF',val), label:'Tornado potential (EF)' };
    }
    case 'highwind': {
      const val = 20 + diag.windPot*0.9;
      return { type, unit:'kt', value:BOB._roundFor(type,'kt',val), label:'Peak gust' };
    }
    case 'coldoutbreak': {
      const val = col.levels.eye.t - 6*diag.soilFreeze;
      return { type, unit:'°F', value:BOB._roundFor(type,'°F',val), label:'Low temperature' };
    }
    default:
      return { type, unit:'', value:0, label:'Event' };
  }
};

// The envelope is monotonic in SEVERITY, not in raw value: at(pct) always runs from the
// Big Bust end (pct 0.05) to the Big Blow end (pct 0.95), so a higher pct is always the
// bigger event. `lo` is the bust end and `hi` the blow end.
//   - Amount events (in/kt/EF): bust = less, blow = more. Bounded at 0.
//   - Temperature (°F, cold outbreak): bust = milder, blow = COLDER. at() therefore
//     decreases in degrees as pct rises, which keeps BBI, the severity tier and the
//     narrative all pointing the same way.
// relWidth grows with marginality.
BOB.envelope = function(fc, diag){
  const v = fc.value;
  const rel = 0.20 + 0.85*(diag.marginality==null?0.4:diag.marginality); // 0.20 tight .. ~1.0 wild
  if (fc.unit === '°F'){
    // additive spread in degrees; more marginal -> larger swing
    const half = 6 + 34*rel;
    const lo = v + half;   // bust end: milder
    const hi = v - half;   // blow end: colder
    return { lo, hi, at:(pct)=> BOB._piecewise(pct, lo, v, hi) };
  }
  // multiplicative for amounts, floored at 0
  let lo = Math.max(0, v*(1-rel));
  let hi = v*(1 + 1.4*rel);
  if (v===0){ lo=0; hi=Math.max(hi, rel*2); }
  return { lo, hi, at:(pct)=> BOB._piecewise(pct, lo, v, hi) };
};
// piecewise-linear through (0.05->lo, 0.5->mid, 0.95->hi); clamps outside [0.05,0.95] to ends.
BOB._piecewise = function(pct, lo, mid, hi){
  if (pct<=0.05) return lo;
  if (pct>=0.95) return hi;
  if (pct<=0.5) return lo + (mid-lo)*((pct-0.05)/0.45);
  return mid + (hi-mid)*((pct-0.5)/0.45);
};
BOB.resolve = function(fc, diag, sliderPos){
  const stop = BOB.SLIDER_STOPS.find(s=>s.pos===sliderPos) || BOB.SLIDER_STOPS[3];
  const env = BOB.envelope(fc, diag);
  const actual = BOB._roundFor(fc.type, fc.unit, env.at(stop.pct));
  return { actual, pct:stop.pct, stop, env };
};

BOB.bbi = function(sliderPos){ return Math.round((sliderPos/3)*100); };

// tierFromThresholds: returns {index (0-100), tier} given value and ascending [thr,label] pairs.
BOB._tier = function(value, pairs, maxRef){
  let tier = pairs[0][1];
  for (const [thr,label] of pairs){ if (value>=thr) tier=label; }
  const index = Math.max(0, Math.min(100, Math.round(100*value/maxRef)));
  return { index, tier };
};
// Which region-climatology weight normalizes each event type's index.
BOB.SEVERITY_CLIM_KEY = {snowstorm:'snow', blizzard:'snow', icestorm:'ice', rainflood:'rain',
  severe:'severe', highwind:'wind', coldoutbreak:'cold'};
// Region normalizer for the index. Like the real RSI, the index is normalized against what
// the region is used to: 12" is a far bigger deal on the Gulf Coast than in the Upper
// Midwest. Impact TIERS stay absolute (12" of snow does the same thing anywhere); only the
// normalized index moves with climatology.
BOB._climFactor = function(type, regionKey){
  const region = BOB.REGIONS.find(r=>r.key===regionKey);
  const key = BOB.SEVERITY_CLIM_KEY[type];
  const f = (region && key) ? region.clim[key] : 1;
  return (typeof f==='number' && f>0) ? f : 1;
};
BOB.severityFor = function(type, value, regionKey){
  const cf = BOB._climFactor(type, regionKey);
  switch(type){
    case 'snowstorm':
    case 'blizzard': {
      const {index,tier}=BOB._tier(value, [[0,'Nuisance'],[2,'Minor'],[6,'Notable'],[12,'Major'],[24,'Crippling'],[40,'Historic']], 48*cf);
      return { scale:'RSI-style', index, tier };
    }
    case 'icestorm': {
      const {index,tier}=BOB._tier(value, [[0,'Glaze'],[0.1,'Minor'],[0.25,'Damaging'],[0.5,'Crippling'],[1.0,'Catastrophic']], 1.5*cf);
      return { scale:'Ice', index, tier };
    }
    case 'rainflood': {
      const {index,tier}=BOB._tier(value, [[0,'Light'],[1,'Soaking'],[3,'Heavy'],[6,'Flooding'],[10,'Catastrophic']], 15*cf);
      return { scale:'Rain', index, tier };
    }
    case 'severe': {
      const tiers=['EF0','EF1','EF2','EF3','EF4','EF5'];
      const ef=Math.max(0,Math.min(5,Math.round(value)));
      const index=Math.max(0,Math.min(100,Math.round(100*ef/(5*cf))));
      return { scale:'EF', index, tier:tiers[ef] };
    }
    case 'highwind': {
      const {index,tier}=BOB._tier(value, [[0,'Breezy'],[35,'Windy'],[50,'High Wind'],[65,'Damaging'],[85,'Extreme']], 120*cf);
      return { scale:'Wind', index, tier };
    }
    case 'coldoutbreak': {
      // colder = more severe; invert
      const pairs=[[100,'Chilly'],[32,'Cold'],[10,'Hard Freeze'],[-5,'Arctic'],[-25,'Life-threatening']];
      let tier='Chilly'; for(const [thr,label] of pairs){ if(value<=thr) tier=label; }
      const index=Math.max(0,Math.min(100,Math.round(100*(40-value)/(80*cf))));
      return { scale:'Cold', index, tier };
    }
    default: return { scale:'', index:0, tier:'' };
  }
};

BOB.TYPE_LABELS = {snowstorm:'snowstorm', blizzard:'blizzard', icestorm:'ice storm',
  rainflood:'rain event', severe:'severe convective outbreak', highwind:'high-wind event',
  coldoutbreak:'cold-air outbreak'};
BOB.narrative = function(col, diag, cls, fc, res){
  const region = (BOB.REGIONS.find(r=>r.key===col.region)||{name:'the region'}).name;
  const label = BOB.TYPE_LABELS[cls.dominant] || 'event';
  const isTemp = fc.unit==='°F';
  const dir = res.stop.pos<0 ? (isTemp?'busted milder':'busted')
            : res.stop.pos>0 ? (isTemp?'blew colder':'blew up') : 'verified';
  const delta = BOB._roundFor(fc.type, fc.unit, res.actual - fc.value);
  const sign = delta>0?'+':'';
  const deltaTxt = delta===0 ? 'exactly on the forecast number'
    : isTemp ? `${Math.abs(delta)}°F ${delta<0?'colder':'milder'} than forecast`
    : `${sign}${delta} vs forecast`;
  const pt = {snow:'snow',rain:'rain',zr:'freezing rain',sleet:'sleet',mix:'a wintry mix',none:'no precip'}[diag.precipType]||diag.precipType;
  let s = `Over the ${region}, the column set up for a ${label}. The official forecast called for `
    + `${fc.value}${isTemp?'°F':' '+fc.unit} (${fc.label.toLowerCase()}), with ${pt} the dominant type. `;
  s += `You dialed it to ${res.stop.label} — the event ${dir} to ${res.actual}${isTemp?'°F':' '+fc.unit} `
    + `(${deltaTxt}). `;
  if (cls.secondary) s += `A secondary ${BOB.TYPE_LABELS[cls.secondary]} threat lurked in the setup. `;
  if (diag.marginality>0.6) s += `The setup was marginal, so the envelope was wide — this outcome was well within reach. `;
  else s += `The setup was robust, so outcomes clustered near the forecast. `;
  return s.trim();
};

BOB.simulate = function(col){
  const diag = BOB.diagnose(col);
  const cls  = BOB.classify(diag, col.region);
  const fc   = BOB.forecast(col, diag, cls);
  const env  = BOB.envelope(fc, diag);
  const region = BOB.REGIONS.find(r=>r.key===col.region) || null;
  return { col, diag, cls, fc, env, region };
};

// Non-blocking notes about physically odd columns (sandbox allows them).
BOB.warnings = function(col){
  const w=[]; const L=col.levels;
  for(let i=1;i<BOB.LEVELS.length;i++){
    const a=BOB.LEVELS[i-1].key, b=BOB.LEVELS[i].key;
    if (L[b].p >= L[a].p) w.push(`Pressure not decreasing with height (${BOB.LEVELS[i].label}).`);
  }
  if (L.eye.t < L.l40.t) w.push('Surface colder than 40k ft — deeply inverted column.');
  return w;
};

BOB.buildInputs = function(){
  const R=BOB.RANGES;
  const rows = BOB.LEVELS.map(l=>{
    const v=BOB.state.levels[l.key];
    const cell=(f,val)=>`<input data-lvl="${l.key}" data-f="${f}" type="number" `
      +`min="${R[f].min}" max="${R[f].max}" step="${R[f].step}" value="${val}" `
      +`style="width:64px;background:var(--panel2);color:var(--ink);border:1px solid var(--edge);border-radius:4px;padding:3px">`;
    return `<tr><td style="color:var(--ink2)">${l.label}</td>`
      +`<td>${cell('t',v.t)}</td><td>${cell('p',v.p)}</td><td>${cell('ws',v.ws)}</td><td>${cell('wd',v.wd)}</td></tr>`;
  }).join('');
  const soil = BOB.SOIL.map(s=>{
    const val=BOB.state.soil[s.key];
    return `<label style="display:inline-block;margin:2px 8px 2px 0">${s.label} `
      +`<input data-soil="${s.key}" type="number" min="${R.soil.min}" max="${R.soil.max}" value="${val}" `
      +`style="width:56px;background:var(--panel2);color:var(--ink);border:1px solid var(--edge);border-radius:4px;padding:3px"></label>`;
  }).join('');
  const regionOpts = BOB.REGIONS.map(r=>`<option value="${r.key}" ${r.key===BOB.state.region?'selected':''}>${r.name}</option>`).join('');
  return `
    <h2 class="sec">Atmospheric column</h2>
    <table style="border-collapse:collapse;font-size:12px">
      <tr style="color:var(--head)"><td></td><td>°F</td><td>mb</td><td>kt</td><td>dir</td></tr>
      ${rows}
    </table>
    <h2 class="sec">Soil temperature (°F)</h2>
    <div>${soil}</div>
    <h2 class="sec">Moisture</h2>
    <input id="moisture" type="range" min="0" max="100" value="${BOB.state.moisture}" style="width:100%">
    <div style="color:var(--ink2);font-size:12px">Bone dry ⟷ Gulf-juiced (<span id="moistval">${BOB.state.moisture}</span>)</div>
    <h2 class="sec">Region</h2>
    <select id="region" style="width:100%;background:var(--panel2);color:var(--ink);border:1px solid var(--edge);border-radius:6px;padding:6px">${regionOpts}</select>
    <div style="margin-top:14px;display:flex;gap:8px">
      <button id="randomize">🎲 Randomize</button>
      <button id="reset">Reset</button>
    </div>`;
};

// Read current DOM inputs back into BOB.state. Returns the state.
BOB.readInputs = function(root){
  root = root || document;
  root.querySelectorAll('input[data-lvl]').forEach(inp=>{
    const lvl=inp.getAttribute('data-lvl'), f=inp.getAttribute('data-f');
    BOB.state.levels[lvl][f]=BOB._num(inp.value, BOB.state.levels[lvl][f]);
  });
  root.querySelectorAll('input[data-soil]').forEach(inp=>{
    BOB.state.soil[inp.getAttribute('data-soil')]=BOB._num(inp.value, 32);
  });
  const m=root.querySelector('#moisture'); if(m) BOB.state.moisture=BOB._num(m.value,65);
  const rg=root.querySelector('#region'); if(rg) BOB.state.region=rg.value;
  return BOB.state;
};

BOB.randomColumn = function(){
  const rnd=(a,b)=>a+Math.random()*(b-a);
  const sfc=rnd(-10,90);
  const lvls={}; let t=sfc, p=1010;
  BOB.LEVELS.forEach((l,i)=>{ if(i>0){ t-=rnd(6,22); p-=rnd(120,200);} lvls[l.key]={t:Math.round(t),p:Math.round(p),ws:Math.round(rnd(5,40)+i*rnd(3,14)),wd:Math.round(rnd(140,300))}; });
  const soilBase=sfc+rnd(-4,8);
  return { levels:lvls, soil:{skin:Math.round(soilBase),d2:Math.round(soilBase+2),d4:Math.round(soilBase+4),d8:Math.round(soilBase+6),d20:Math.round(soilBase+9)},
           moisture:Math.round(rnd(0,100)), region:BOB.REGIONS[Math.floor(Math.random()*BOB.REGIONS.length)].key };
};

window.__bobTests.push((t) => {
  t('buildInputs emits column table + region select', (function(){
    const html=BOB.buildInputs();
    return html.indexOf('Atmospheric column')>=0 && html.indexOf('id="region"')>=0 &&
           (html.match(/data-lvl=/g)||[]).length===24; // 6 levels x 4 fields
  })());
  t('randomColumn well-formed', (function(){
    const c=BOB.randomColumn();
    return c.levels.eye && typeof c.levels.eye.t==='number' && c.soil.skin!=null &&
           BOB.REGIONS.some(r=>r.key===c.region);
  })());
});

BOB.renderReport = function(sim, sliderPos){
  const {col, diag, cls, fc} = sim;
  const res = BOB.resolve(fc, diag, sliderPos);
  const sev = BOB.severityFor(fc.type, res.actual, col.region);
  const fsev = BOB.severityFor(fc.type, fc.value, col.region);
  const bbi = BOB.bbi(sliderPos);
  const bbiColor = bbi<0?'var(--bust)':bbi>0?'var(--blow)':'var(--bull)';
  const unit = fc.unit==='°F'?'°F':' '+fc.unit;
  const stops = BOB.SLIDER_STOPS.map(s=>`<option value="${s.pos}" ${s.pos===sliderPos?'selected':''}>${s.label}</option>`).join('');
  return `
    <h2 class="sec">Forecast → Actual</h2>
    <div style="display:flex;gap:24px;flex-wrap:wrap;align-items:flex-end">
      <div><div style="color:var(--ink2);font-size:12px">Official forecast</div>
        <div style="font-size:26px;font-weight:700">${fc.value}${unit}</div>
        <div style="color:var(--ink2);font-size:12px">${fc.label} · ${fsev.tier}</div></div>
      <div style="font-size:26px;color:var(--ink2)">→</div>
      <div><div style="color:var(--ink2);font-size:12px">Actual (${res.stop.label})</div>
        <div style="font-size:34px;font-weight:800;color:${bbiColor}">${res.actual}${unit}</div>
        <div style="color:var(--ink2);font-size:12px">${sev.scale} · ${sev.tier} · index ${sev.index}</div></div>
      <div><div style="color:var(--ink2);font-size:12px">Bust–Blow Index</div>
        <div style="font-size:26px;font-weight:800;color:${bbiColor}">${bbi>0?'+':''}${bbi}</div></div>
    </div>
    <h2 class="sec">Dial the outcome</h2>
    <input id="slider" type="range" min="-3" max="3" step="1" value="${sliderPos}" style="width:100%">
    <div style="display:flex;justify-content:space-between;color:var(--ink2);font-size:11px">
      <span>Big Bust</span><span>Bullseye</span><span>Big Blow</span></div>
    <div style="margin-top:6px"><select id="sliderSel">${stops}</select></div>
    <h2 class="sec">Region &amp; footprint</h2>
    ${BOB.renderMap(col.region, fc.type)}
    <h2 class="sec">Narrative</h2>
    <p style="max-width:640px">${BOB.narrative(col, diag, cls, fc, res)}</p>
    ${(function(){ const w=BOB.warnings(col); return w.length
        ? `<div style="margin-top:10px;padding:8px 10px;border:1px solid var(--severe);border-radius:6px;color:var(--severe);font-size:12px">⚠ ${w.join(' ')}</div>`
        : ''; })()}`;
};

BOB.sliderPos = 0;
BOB.render = function(){
  const inputs=document.getElementById('inputs');
  const results=document.getElementById('results');
  inputs.innerHTML = BOB.buildInputs();
  const sim = BOB.simulate(BOB.state);
  results.innerHTML = BOB.renderReport(sim, BOB.sliderPos);
  BOB._wire();
};
BOB._recompute = function(){ BOB.readInputs(); BOB.render(); };
BOB._wire = function(){
  document.querySelectorAll('input[data-lvl],input[data-soil]').forEach(i=>i.addEventListener('change', BOB._recompute));
  const m=document.getElementById('moisture'); if(m) m.addEventListener('input', ()=>{ document.getElementById('moistval').textContent=m.value; BOB.readInputs(); const sim=BOB.simulate(BOB.state); document.getElementById('results').innerHTML=BOB.renderReport(sim,BOB.sliderPos); BOB._wire(); });
  const rg=document.getElementById('region'); if(rg) rg.addEventListener('change', BOB._recompute);
  const sl=document.getElementById('slider'); if(sl) sl.addEventListener('input', ()=>{ BOB.sliderPos=parseInt(sl.value,10); const sim=BOB.simulate(BOB.state); document.getElementById('results').innerHTML=BOB.renderReport(sim,BOB.sliderPos); BOB._wire(); });
  const ss=document.getElementById('sliderSel'); if(ss) ss.addEventListener('change', ()=>{ BOB.sliderPos=parseInt(ss.value,10); const sim=BOB.simulate(BOB.state); document.getElementById('results').innerHTML=BOB.renderReport(sim,BOB.sliderPos); BOB._wire(); });
  const rnd=document.getElementById('randomize'); if(rnd) rnd.addEventListener('click', ()=>{ BOB.state=BOB.randomColumn(); BOB.render(); });
  const rst=document.getElementById('reset'); if(rst) rst.addEventListener('click', ()=>{ BOB.state=JSON.parse(JSON.stringify(BOB.DEFAULT_COLUMN)); BOB.sliderPos=0; BOB.render(); });
};
// boot (skip when running selftest)
if (!/(\?|&)selftest\b/.test(location.search)) {
  window.addEventListener('DOMContentLoaded', BOB.render);
}

window.__bobTests.push((t) => {
  const sim=BOB.simulate(BOB.DEFAULT_COLUMN);
  const html=BOB.renderReport(sim, 0);
  t('report shows forecast + actual + BBI', /Official forecast/.test(html) && /Bust–Blow Index/.test(html) && /id="slider"/.test(html));
  const blow=BOB.renderReport(sim, 3), bust=BOB.renderReport(sim,-3);
  t('report reflects slider label', /Big Blow/.test(blow) && /Big Bust/.test(bust));
});

/* ================= SELF-TEST HARNESS ================= */
(function(){
  if (!/(\?|&)selftest\b/.test(location.search)) return;
  document.getElementById('app').style.display='none';
  const el = document.getElementById('selftest'); el.style.display='block';
  let pass=0, fail=0; const rows=[];
  function approx(a,b,tol){ return Math.abs(a-b) <= (tol==null?1e-6:tol); }
  function t(name, cond){
    if (cond){ pass++; rows.push('<div class="pass">✓ '+name+'</div>'); }
    else { fail++; rows.push('<div class="fail">✗ '+name+'</div>'); }
  }
  try { (window.__bobTests||[]).forEach(fn => fn(t, approx)); }
  catch(e){ fail++; rows.push('<div class="fail">✗ threw: '+e.message+'</div>'); }
  const total = pass+fail;
  el.innerHTML = '<div class="sum '+(fail?'fail':'pass')+'">SELFTEST '+pass+'/'+total+' '+(fail?'FAIL':'PASS')+'</div>'+rows.join('');
  console.log('SELFTEST '+pass+'/'+total+' '+(fail?'FAIL':'PASS'));
})();
</script>
</body>
